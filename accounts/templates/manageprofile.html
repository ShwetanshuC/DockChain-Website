{% extends 'base.html' %}
{% load static %}

{% block page_content %}
<div class="container mt-5">
    <h2>Manage Profile</h2>
    <hr>

    <h4>Account Info</h4>
    <p><strong>Username:</strong> {{ user.username }} <a href="{% url 'edit_username' %}" class="btn btn-sm btn-secondary">Edit</a></p>
    <p><strong>Email:</strong> {{ user.email }} <a href="{% url 'change_email' %}" class="btn btn-sm btn-secondary">Change</a></p>

    <hr>
    <h4>Security</h4>
    <a href="{% url 'change_password_custom' %}" class="btn btn-warning">Change Password</a>

    <hr>
    <h4>Danger Zone</h4>
    <form method="POST" action="{% url 'delete_account' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete Account</button>
    </form>
</div>
{% endblock %}
