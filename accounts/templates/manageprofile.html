{% extends 'base.html' %}
{% load static %}

{% block interface_content %}

<link rel = "stylesheet" href = "{%static 'ManageProfile/style.css' %}">
<div class="container mt-5">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} mt-2">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}
    <h2>Manage Profile</h2>
    <hr>

    <h4>Account Info</h4>

    <!-- Username Update Form -->
    <form method="POST" class="mb-3">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" class="form-control" name="username" value="{{ user.username }}">
        </div>
        <button type="submit" name="action" value="update_username" class="btn btn-sm btn-secondary mt-1">Update Username</button>
    </form>

    <!-- Email Update Form -->
    <form method="POST" class="mb-3">
        {% csrf_token %}
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" class="form-control" name="email" value="{{ user.email }}">
        </div>
        <button type="submit" name="action" value="update_email" class="btn btn-sm btn-secondary mt-1">Update Email</button>
    </form>

    <hr>
    <h4>Security</h4>
    <form method="POST" class="mb-3">
        {% csrf_token %}
        <input type="hidden" name="action" value="change_password">
        <button type="submit" class="btn btn-warning">Change Password</button>
    </form>

    <hr>
    <h4>Danger Zone</h4>
    <form method="POST" onsubmit="return confirmDelete();">
        {% csrf_token %}
        <input type="hidden" name="action" value="delete_account">
        <button type="submit" class="btn btn-danger">Delete Account</button>
    </form>
</div>
<script>
    function confirmDelete() {
        if (confirm('Are you sure you want to delete your account? This action cannot be undone.')) {
            setTimeout(function() {
                window.location.href = '/';  // Redirect to home
            }, 500);
            return true;
        }
        return false;
    }
</script>
{% endblock %}
