{% extends "signupbase.html" %}
{% load static %}
{% block title %}Sign Up{% endblock %}

{% block signup_content %}
<body>
  <div class="banner-container position-relative text-center text-white py-5 d-flex flex-column justify-content-center align-items-center" style="padding: 8rem 1rem; max-height: 200px;">
    <h2 class="registration-title">Sign Up</h2>
    <p class="fs-4 mt-3 mb-0 text-white">Enter your information below.</p>
  </div>

  <form method="post">
    <div class="form_style">
      {% csrf_token %}  
      <div class="mb-1 formattedfield">
        <p class="text-muted">Email</p>
        <input type="text" name="email" class="form-control form-control-sm" required>
      </div>
      <div class="mb-1 formattedfield">
        <p class="text-muted">Password</p>
        <input type="text" name="password" class="form-control form-control-sm" required>
      </div>
      <div class="mb-1 formattedfield">
        <p class="text-muted">Organization</p>
        <input type="text" name="organization" class="form-control form-control-sm" required>
      </div>
      <div class="mb-1 formattedfield">
        <p class="text-muted">Cargo Broker?</p>
        <input type="text" name="is_cargo_broker" class="form-control form-control-sm" required>
      </div>
      <div class="mb-1 formattedfield">
        <p class="text-muted">Services, in list format</p>
        <input type="text" name="services" class="form-control form-control-sm" required>
      </div>
      <!-- {{ form }}-->
      <button class="form_style btn btn-primary btn-lg" type="submit">Sign Up</button>
    </div>
  </form>
</body>
{% endblock %}
