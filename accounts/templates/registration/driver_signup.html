{% extends "signupbase.html" %}

{% block title %}Sign Up{% endblock %}

{% block signup_content %}

<h2>Sign up</h2>
<form method="post">
  <div class="form_style">
    {% csrf_token %}
    <div class="mb-1">
      <input type="text" name="email" class="form-control form-control-sm" required>
    </div>
    <div class="mb-1">
      <input type="text" name="password" class="form-control form-control-sm" required>
    </div>
    <div class="mb-1">
      <input type="text" name="first_name" class="form-control form-control-sm" required>
    </div>
    <div class="mb-1">
      <input type="text" name="last_name" class="form-control form-control-sm" required>
    </div>
     <div class="mb-1">
      <input type="text" name="qualifications" class="form-control form-control-sm" required>
    </div>
     <div class="mb-1">
      <input type="text" name="state" class="form-control form-control-sm" required>
    </div>
     <div class="mb-1">
      <input type="text" name="truck_license" class="form-control form-control-sm" required>
    </div>
    <!--{{ form }}-->
    <button class="form_style btn btn-primary btn-lg" type="submit">Sign Up</button>
  </div>
</form>
{% endblock %}
