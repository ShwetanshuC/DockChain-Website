{% extends "signupbase.html" %}

{% block title %}Sign Up{% endblock %}

{% block signup_content %}

<h2>Sign up</h2>
<form method="post">
  <div class="form_style">
    {% csrf_token %}
    {{ form }}
    <button class="form_style btn btn-primary btn-lg" type="submit">Sign Up</button>
  </div>
</form>
{% endblock %}
